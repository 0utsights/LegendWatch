pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Kikugie'
            url = 'https://maven.kikugie.dev/releases'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.5.2'
}

stonecutter {
    centralScript = "build.gradle"
    create(rootProject) {
        versions '26.3', '26.2', '1.21.11'
        vcsVersion = '26.3'
    }
}

rootProject.name = 'LegendWatch - Hoplite'
